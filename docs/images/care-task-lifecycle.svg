<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title"><title id="title">Care-task state transitions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7352"/></marker></defs><rect width="1000" height="310" rx="16" fill="#f6faf6"/><polyline points="46,102 120,102" fill="none" stroke="#4a7352" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="390,102 460,102 460,54 590,54" fill="none" stroke="#4a7352" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="390,102 460,102 460,170 590,170" fill="none" stroke="#4a7352" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="36" cy="102" r="10" fill="#285a36"/><rect x="120" y="60" width="270" height="84" rx="10" fill="white" stroke="#91b39a" stroke-width="1.5"/><text x="255.0" y="100.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#173b22">SCHEDULED</text><text x="255.0" y="123.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#47624c">Pending care occurrence</text><rect x="590" y="20" width="270" height="68" rx="10" fill="white" stroke="#91b39a" stroke-width="1.5"/><text x="725.0" y="60.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#173b22">DONE</text><rect x="590" y="136" width="270" height="68" rx="10" fill="white" stroke="#91b39a" stroke-width="1.5"/><text x="725.0" y="176.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#173b22">SKIPPED</text><text x="478" y="38" font-family="Arial, sans-serif" font-size="14" fill="#47624c">Mark done</text><text x="478" y="222" font-family="Arial, sans-serif" font-size="14" fill="#47624c">Skip or handle overdue</text><text x="490" y="270" text-